<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unggah Data Kendaraan</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js';</script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #000; color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #fff; font-size: 22px; }
        .format-buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .format-buttons span { background-color: #ff0000; color: #fff; padding: 10px 16px; border-radius: 5px; font-weight: bold; }
        .upload-box { border: 2px dashed #ff0000; border-radius: 10px; padding: 30px 20px; text-align: center; margin-bottom: 20px; }
        .btn { background-color: #ff0000; color: #fff; border: none; padding: 12px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:disabled { background-color: #555; }
        .status { margin-top: 15px; padding: 12px; border-radius: 5px; text-align: center; display: none; }
        .status.sukses { background: #1a4d1a; color: #90ee90; display: block; }
        .status.warning { background: #4d4d1a; color: #ffff90; display: block; }
        .status.error { background: #4d1a1a; color: #ffb3b3; display: block; }
        .loading { text-align: center; display: none; margin: 15px 0; }
        .spinner { border: 3px solid #333; border-top: 3px solid #ff0000; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .file-list { background: #1a1a1a; padding: 12px; border-radius: 5px; margin-bottom: 15px; display: none; }
        .file-item { padding: 6px 0; border-bottom: 1px solid #333; font-size: 13px; }
        .file-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📂 Unggah Data Kendaraan</h1>
        
        <div class="format-buttons">
            <span>📄 XLSX</span>
            <span>📊 CSV</span>
            <span>📑 PDF</span>
            <span>🖼️ JPG</span>
            <span>🖼️ JPEG</span>
        </div>

        <div class="upload-box">
            <p style="font-size: 18px; margin-bottom: 15px;">Pilih File</p>
            <p style="font-size: 13px; color: #888; margin-bottom: 20px;">Mendukung: XLSX, CSV, PDF, JPG, JPEG</p>
            <input type="file" id="fileInput" accept=".xlsx,.csv,.pdf,.jpg,.jpeg,.png" multiple style="display: none;">
            <button class="btn" onclick="document.getElementById('fileInput').click()">PILIH FILE</button>
        </div>

        <div class="file-list" id="fileList">
            <strong style="margin-bottom: 8px; display: block;">📁 File Terpilih:</strong>
            <div id="fileListContent"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p id="loadingText" style="margin-top: 10px;">Memproses...</p>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBonuHp4nd-YZKwV5IM_2HRCfJ2TQ4zJaY",
            authDomain: "gen-lang-client-0221970857.firebaseapp.com",
            databaseURL: "https://gen-lang-client-0221970857-default-rtdb.firebaseio.com/",
            projectId: "gen-lang-client-0221970857",
            storageBucket: "gen-lang-client-0221970857.firebasestorage.app",
            messagingSenderId: "483674298302",
            appId: "1:483674298302:web:8c6ccf111af4de7bbecbef"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const kolomPeta = {
            'waktu_penemuan': 'waktuPenemuan', 'wilayah': 'wilayah', 'nopol': 'noPolisi', 'no_polisi': 'noPolisi',
            'seri': 'seri', 'noka': 'nomorRangka', 'nosin': 'nomorMesin', 'nama_pemilik': 'namaPemilik',
            'no_ktp': 'noKtp', 'nik': 'noKtp', 'no_kk': 'noKk', 'no_hp': 'noHp', 'email': 'email',
            'pekerjaan': 'pekerjaan', 'alamat': 'alamat', 'rt': 'rt', 'rw': 'rw', 'merk': 'merk',
            'type': 'tipe', 'tahun_pembuatan': 'tahunPembuatan', 'cc': 'isiSilinder', 'warna': 'warna',
            'mssdn': 'mssdn', 'no_bpkb': 'noBpkb', 'no_stnk': 'noStnk', 'tgl_daftar': 'tglDaftar'
        };

        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', prosesFile);

        async function prosesFile(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // Tampilkan daftar file
            const fileList = document.getElementById('fileList');
            const fileListContent = document.getElementById('fileListContent');
            fileList.style.display = 'block';
            fileListContent.innerHTML = files.map((f, i) => 
                `<div class="file-item">${i + 1}. ${f.name} — ${(f.size/1024).toFixed(1)} KB</div>`
            ).join('');

            tampilkanLoading(true, `Siap memproses ${files.length} file...`);
            tampilkanStatus('', '');

            const semuaData = [];
            let berhasil = 0, gagal = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const ekstensi = file.name.split('.').pop().toLowerCase();
                tampilkanLoading(true, `(${i+1}/${files.length}) Memproses: ${file.name}`);

                try {
                    let hasil = [];
                    
                    if (ekstensi === 'xlsx') {
                        hasil = await bacaXLSX(file);
                    } else if (ekstensi === 'csv') {
                        hasil = await bacaCSV(file);
                    } else if (ekstensi === 'pdf') {
                        hasil = await bacaPDF(file);
                    } else if (['jpg', 'jpeg', 'png'].includes(ekstensi)) {
                        hasil = [bacaGambar(file)];
                    } else {
                        gagal++;
                        continue;
                    }

                    semuaData.push(...hasil);
                    berhasil++;
                    
                } catch (err) {
                    console.error(file.name, err);
                    gagal++;
                }
            }

            // Normalisasi & simpan
            tampilkanLoading(true, `Menyimpan ${semuaData.length} data ke Firebase...`);
            
            const dataBersih = semuaData.map(baris => {
                const obj = {};
                for (const [k, v] of Object.entries(baris)) {
                    const kunci = String(k).trim().toLowerCase();
                    obj[kolomPeta[kunci] || kunci] = v !== undefined ? v : '';
                }
                return obj;
            }).filter(b => Object.values(b).some(v => v && String(v).trim() !== ''));

            if (dataBersih.length > 0) {
                const batch = {};
                dataBersih.forEach((item, idx) => {
                    const kunci = item.nomorRangka || item.noPolisi || `data_${Date.now()}_${idx}`;
                    batch[String(kunci).replace(/[.#$/[\]]/g, '_')] = item;
                });
                await db.ref('data_kendaraan').update(batch);
                tampilkanStatus(`✅ Berhasil: ${berhasil} file, ${dataBersih.length} data tersimpan!${gagal > 0 ? ` ⚠️ ${gagal} file gagal` : ''}`, 'sukses');
            } else {
                tampilkanStatus('⚠️ Tidak ada data yang valid disimpan', 'warning');
            }

            tampilkanLoading(false);
        }

        function bacaXLSX(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const wb = XLSX.read(e.target.result, { type: 'array' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        resolve(XLSX.utils.sheet_to_json(ws, { defval: '' }));
                    } catch (err) { reject(err); }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function bacaCSV(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const teks = e.target.result;
                        const baris = teks.split(/\r?\n/).filter(b => b.trim() !== '');
                        if (baris.length < 2) { resolve([]); return; }
                        const pemisah = teks.includes(';') ? ';' : ',';
                        const header = baris[0].split(pemisah).map(h => h.trim().replace(/^"|"$/g, ''));
                        const data = [];
                        for (let i = 1; i < baris.length; i++) {
                            const nilai = baris[i].split(pemisah).map(n => n.trim().replace(/^"|"$/g, ''));
                            if (nilai.every(n => n === '')) continue;
                            const obj = {};
                            header.forEach((k, idx) => obj[k] = nilai[idx] || '');
                            data.push(obj);
                        }
                        resolve(data);
                    } catch (err) { reject(err); }
                };
                reader.readAsText(file);
            });
        }

        async function bacaPDF(file) {
            const buf = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            let teks = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const txt = await page.getTextContent();
                teks += txt.items.map(x => x.str).join(' ') + '\n';
            }
            return [{ isiPDF: teks, namaFile: file.name }];
        }

        function bacaGambar(file) {
            return {
                namaFile: file.name,
                jenis: 'Gambar',
                ukuran: (file.size / 1024).toFixed(2) + ' KB',
                tipe: file.type,
                waktu: new Date().toLocaleString('id-ID')
            };
        }

        function tampilkanLoading(aktif, teks) {
            document.getElementById('loading').style.display = aktif ? 'block' : 'none';
            if (teks) document.getElementById('loadingText').textContent = teks;
        }

        function tampilkanStatus(pesan, jenis) {
            const el = document.getElementById('status');
            el.textContent = pesan;
            el.className = 'status ' + jenis;
            el.style.display = pesan ? 'block' : 'none';
        }
    </script>
</body>
</html>
